<app-button
  (click)="back()"
  [styles]="{
    width: '40px',
    height: '40px',
    border: '2px solid #E5E7EB',
    'background-color': 'transparent',
    color: '#1F2937',
    'margin-bottom':'18px' 
  }"
  ><i class="fa-solid fa-arrow-left"></i
></app-button>
<h2 class="title text-2xl md:text-3xl font-bold mb-2.5">Password Reset Sent</h2>
<div class="flex flex-col gap-4 mono">
  <p class="text-gray-800">
    We have sent a password reset link to:
    <span class="text-blue-600"> {{ sentEmail() }} </span>
  </p>
  <p class="text-gray-800">
    Please check your inbox and follow the instructions to reset your password.
  </p>
  <p class="text-gray-500">
    If you don’t see the email within a few minutes, check your spam or junk folder.
  </p>
  <p class="text-gray-500">
    Don’t have an account? <a routerLink="/register" class="text-blue-600">Create yours</a>
  </p>
</div>

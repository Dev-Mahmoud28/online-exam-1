<h2 class="title text-2xl md:text-3xl font-bold mb-4">Create Account</h2>
<div class="flex flex-col gap-4 mono">
  <form [formGroup]="registerForm" class="flex flex-col gap-4" (ngSubmit)="sendEmail()">
    <div class="email flex flex-col gap-2.5">
      <app-input
        [type]="'email'"
        label="Email"
        id="email"
        placeholder="user@example.com"
        [control]="emailControl"
      ></app-input>
      @if((emailControl.hasError("required") && emailControl.touched) || emailControl.hasError("email")){
        <app-error-banner></app-error-banner>
      }
    </div>
    <app-button
      type="submit"
      [styles]="{ 'background-color': '#EFF6FF', color: '#1F2937', border: '1px solid #155DFC' }"
      >Next <i class="fa-solid fa-angle-right"></i
    ></app-button>
  </form>
  <p class="text-gray-500 text-center">
    Already have an account? <a routerLink="/login" class="text-blue-600">Login</a>
  </p>
</div>
